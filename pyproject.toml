[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-arbiter"
version = "0.1.0"
description = "Governed decision runtime, policy control plane, and MCP supervisor for TypeSafe Jev and local typed-decision models."
readme = "doc/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jev Arbiter Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "httpx[http2]>=0.27.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
jev-arbiter = "arbiter.cli.main:main"
arbiter = "arbiter.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
