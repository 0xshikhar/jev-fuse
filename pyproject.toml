[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbiter-runtime"
version = "0.1.0"
description = "An open decision-runtime and policy control plane for coding agents"
readme = "doc/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Arbiter Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "httpx[http2]>=0.27.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
