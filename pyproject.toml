[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-fuse"
version = "0.1.0"
description = "Governed decision runtime, policy control plane, and MCP supervisor for TypeSafe Jev and local typed-decision models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "JEV-Fuse Contributors" }
]
keywords = [
    "typesafe",
    "jev",
    "decision-models",
    "system-one",
    "claude-code",
    "mcp",
    "governance",
    "security-guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "httpx[http2]>=0.27.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/0xshikhar/jev-fuse"
Repository = "https://github.com/0xshikhar/jev-fuse"
Issues = "https://github.com/0xshikhar/jev-fuse/issues"
Documentation = "https://github.com/0xshikhar/jev-fuse#readme"

[project.scripts]
jevfuse = "jevfuse.cli.main:main"
jev-fuse = "jevfuse.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
vercel = [
    "ai>=0.7.0; python_version >= '3.12'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jevfuse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
